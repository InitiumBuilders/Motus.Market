<!DOCTYPE html>
<html lang="en" data-mode="nox">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOTUS.MARKET — The Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/neoglass.css">
<style>
.wrap{max-width:840px;margin:0 auto;padding:110px 22px 120px}
.bar{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:6px;padding:8px;border-radius:var(--r-pill);
  background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 14px 40px rgba(0,0,0,.3)}
.bar a,.bar button{display:inline-flex;align-items:center;min-height:44px;padding:0 15px;white-space:nowrap;
  border-radius:var(--r-pill);color:var(--ink);text-decoration:none;background:none;
  border:none;cursor:pointer;font-family:var(--font);font-size:.92rem;font-weight:600;
  transition:background .25s}
.bar a:hover,.bar button:hover{background:var(--glass-2)}
.bar .brand{font-family:var(--display);font-weight:800;font-size:.74rem;letter-spacing:.01em}.bar .brand b{color:var(--cyan)}
.doc{padding:52px clamp(24px,6vw,60px);line-height:1.75;font-size:.99rem;font-weight:500}
.doc h1{font-family:var(--display);font-size:clamp(1.2rem,3.6vw,1.9rem);font-weight:800;letter-spacing:-.015em;
  line-height:1.15;margin:0 0 18px}
.doc h2{font-size:1.35rem;font-weight:800;margin:52px 0 16px}
.doc h3{font-size:1.08rem;font-weight:800;margin:36px 0 12px}
.doc p{margin:0 0 16px;overflow-wrap:anywhere}
.doc strong{font-weight:800}
.doc em{font-style:italic}
.doc a{color:var(--cyan);font-weight:700;text-decoration:none;border-bottom:1px solid var(--cyan)}
.doc ul,.doc ol{margin:0 0 18px;padding-left:26px}
.doc li{margin:7px 0}
.doc blockquote{margin:24px 0;padding:18px 24px;border-left:2px solid var(--cyan);
  background:var(--glass);border-radius:0 var(--r-ctl) var(--r-ctl) 0;font-weight:600}
.doc blockquote p{margin:0}
.doc code{overflow-wrap:anywhere;font-family:var(--mono);font-size:.88em;font-weight:600;
  background:var(--glass-2);border:1px solid var(--edge);border-radius:7px;padding:2px 7px}
.doc pre{margin:22px 0;padding:22px 24px;overflow-x:auto;background:var(--glass);
  border:1px solid var(--edge);border-radius:var(--r-ctl)}
.doc pre code{background:none;border:none;padding:0;font-size:.86rem;line-height:1.7;font-weight:500}
.doc table{width:100%;border-collapse:collapse;margin:22px 0;font-size:.92rem}
.doc th{font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;text-align:left;padding:12px 14px;color:var(--cyan);
  border-bottom:1px solid var(--edge-hi)}
.doc td{padding:12px 14px;border-bottom:1px solid var(--edge);font-weight:500;vertical-align:top}
.doc .tblwrap{overflow-x:auto;margin:22px 0}
.doc .tblwrap table{margin:0;min-width:520px}
.doc hr{border:0;height:1px;margin:44px auto;width:64%;
  background:linear-gradient(90deg,transparent,rgba(28,231,255,.5),transparent)}
@media(max-width:720px){
  .wrap{padding:96px 12px 90px}
  .doc{padding:34px 18px;font-size:1rem;line-height:1.7}
  .doc h1{font-size:1.5rem;line-height:1.2}
  .doc h2{font-size:1.18rem;margin:38px 0 12px}
  .doc h3{font-size:1.02rem;margin:26px 0 10px}
  .doc pre{padding:16px 14px;margin:18px -4px}
  .doc pre code{font-size:12px;line-height:1.55}
  .doc .tblwrap{margin:18px -4px;position:relative}
  .doc .tblwrap table{min-width:100%}
  .doc th{font-size:.68rem;padding:10px 8px;letter-spacing:.08em}
  .doc td{padding:10px 8px;font-size:.9rem}
  .doc blockquote{padding:14px 16px;margin:20px 0}
  .doc hr{width:82%;margin:34px auto}
}
/* a scrollable block announces itself */
.doc pre,.doc .tblwrap{-webkit-overflow-scrolling:touch;
  -webkit-mask:linear-gradient(90deg,#000 0,#000 92%,rgba(0,0,0,.35));
  mask:linear-gradient(90deg,#000 0,#000 92%,rgba(0,0,0,.35))}
</style>
</head>
<body>
<div class="field" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="infGrad" x1="0" y1="1" x2="1" y2="0">
  <stop offset="0" stop-color="#0066ff"/><stop offset=".42" stop-color="#1ce7ff"/>
  <stop offset="1" stop-color="#c2fbff"/>
</linearGradient>
<filter id="infGlowS" x="-40%" y="-90%" width="180%" height="280%">
  <feGaussianBlur stdDeviation="3"/></filter>
<path id="lemni" d="M120 60C96 18 24 18 24 60s72 42 96 0 72-42 96 0-72 42-96 0Z"/>

<g id="g-sun"><circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
<g id="g-moon"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.8 6.8 0 0 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></g>
</defs></svg>
<nav class="bar" aria-label="Reader">
  <a class="brand" href="/"><img class="inf" src="/assets/logo.png" alt="" aria-hidden="true"><span>MOTUS<b>.MARKET</b></span></a>
  <a href="/app.html">Market</a>
  <a href="/hope.html">Mindset</a>
  <a href="/read.html?f=spec.md">!MOVE</a>
  <button class="modeSw" id="modeSw" type="button" aria-label="Toggle NOX / LUX">
    <svg class="glyph" style="width:18px;height:18px"><use href="#g-moon" id="modeGlyph"/></svg><span id="modeWord">NOX</span>
  </button>
</nav>
<div class="wrap"><article class="pane doc" id="doc"><p>Opening…</p></article></div>
<script>
(function(){
  'use strict';
  var root=document.documentElement;
  var sw=document.getElementById('modeSw'),word=document.getElementById('modeWord'),
      gl=document.getElementById('modeGlyph');
  function setMode(m,save){root.setAttribute('data-mode',m);
    word.textContent=m.toUpperCase();
    gl.setAttribute('href',m==='nox'?'#g-moon':'#g-sun');
    if(save){try{localStorage.setItem('motus.mode',m)}catch(e){}}}
  var saved=null;try{saved=localStorage.getItem('motus.mode')}catch(e){}
  if(saved==='lux'||saved==='nox')setMode(saved,false);
  sw.addEventListener('click',function(){
    setMode(root.getAttribute('data-mode')==='nox'?'lux':'nox',true)});

  /* whitelist — only the library ships */
  var DOCS={'spec.md':1,'neoglass.md':1,'notes-reflect.md':1,'clarity-tips.md':1,'notes-legendary.md':1};
  var f=new URLSearchParams(location.search).get('f')||'spec.md';
  if(!DOCS[f])f='spec.md';
  var el=document.getElementById('doc');

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function inline(s){
    return s
      .replace(/`([^`]+)`/g,function(_,c){return '<code>'+c+'</code>'})
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,'<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>');
  }
  function render(md){
    var lines=md.split('\n'),out=[],i=0;
    while(i<lines.length){
      var L=lines[i];
      if(/^```/.test(L)){var buf=[];i++;
        while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}
        i++;out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue}
      if(/^\|/.test(L)){var rows=[];
        while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++}
        var body=rows.filter(function(r){return !/^\|[\s:|-]+\|$/.test(r)});
        var html='<div class="tblwrap"><table>';
        body.forEach(function(r,ri){
          var cells=r.replace(/^\||\|$/g,'').split('|');
          html+='<tr>'+cells.map(function(c){
            return (ri===0?'<th>':'<td>')+inline(esc(c.trim()))+(ri===0?'</th>':'</td>')}).join('')+'</tr>';
        });
        out.push(html+'</table></div>');continue}
      if(/^---\s*$/.test(L)){out.push('<hr>');i++;continue}
      if(/^>/.test(L)){var qb=[];
        while(i<lines.length&&/^>/.test(lines[i])){qb.push(lines[i].replace(/^>\s?/,''));i++}
        out.push('<blockquote><p>'+inline(esc(qb.join(' ')))+'</p></blockquote>');continue}
      var m=L.match(/^(#{1,3})\s+(.*)/);
      if(m){out.push('<h'+m[1].length+'>'+inline(esc(m[2]))+'</h'+m[1].length+'>');i++;continue}
      if(/^[-*]\s+/.test(L)){var lb=[];
        while(i<lines.length&&/^[-*]\s+/.test(lines[i])){
          lb.push('<li>'+inline(esc(lines[i].replace(/^[-*]\s+/,'')))+'</li>');i++}
        out.push('<ul>'+lb.join('')+'</ul>');continue}
      if(/^\d+\.\s+/.test(L)){var ob=[];
        while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){
          ob.push('<li>'+inline(esc(lines[i].replace(/^\d+\.\s+/,'')))+'</li>');i++}
        out.push('<ol>'+ob.join('')+'</ol>');continue}
      if(/^\s*$/.test(L)){i++;continue}
      var pb=[L];i++;
      while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#|>|[-*]\s|\d+\.\s|\||```|---)/.test(lines[i])){
        pb.push(lines[i]);i++}
      out.push('<p>'+inline(esc(pb.join(' ')))+'</p>');
    }
    return out.join('\n');
  }
  fetch('/'+f).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.text()
  }).then(function(md){
    el.innerHTML=render(md);document.title='MOTUS.MARKET — '+f;
  }).catch(function(){
    el.innerHTML='<p><strong>Could not open '+esc(f)+'.</strong> <a href="/">Back to the engine</a></p>';
  });
})();
</script>
</body>
</html>
